<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send Money - SmartWallet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../style/global.css">
  <link rel="stylesheet" href="../style/send.css">
</head>
<body>

  <div class="send-container">
    
    <div class="contact-list-panel">
      <div class="panel-header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
        <h2>Send to User</h2>
        <p>Select a user from your contacts to begin.</p>
      </div>

      <input type="text" id="search-bar" placeholder="Search by name or phone...">
      
      <div class="data-list-container">
        <div class="data-list" id="data-list">
          <div class="text-center text-muted" style="padding: 2rem;">Loading contacts...</div>
        </div>
      </div>
    </div>

    <div class="payment-panel">

      <div id="payment-form-container" class="d-none">
        <h4>Sending payment to:</h4>
        <div class="receiver-info">
          <div class="avatar" id="modal-receiver-initials">R</div>
          <h3 id="modal-receiver-name">[Receiver Name]</h3>
        </div>
        <div class="payer-info" style="margin-top:0.5rem;color:#555;font-size:0.95rem;">
          You are paying to: <strong id="receiver-id">#?</strong>
        </div>
        
        <form id="payment-form">
          <input type="hidden" id="modal-receiver-id">
          <input type="hidden" id="modal-receiver-type" value="USER">

          <div class="form-group">
            <label for="amount" class="form-label">Amount (₹)</label>
            <input type="number" step="0.01" class="form-control" id="amount" placeholder="0.00" required>
          </div>
          <div class="form-group">
            <label for="wallet-pin" class="form-label">Wallet PIN</label>
            <input type="password" class="form-control" id="wallet-pin" placeholder="6-digit PIN" maxlength="6" required>
          </div>
          <div class="form-group">
            <label for="description" class="form-label">Description (Optional)</label>
            <input type="text" class="form-control" id="description" placeholder="e.g., Dinner split">
          </div>
          <div class="form-group">
            <button type="submit" class="btn-primary">Send Payment</button>
          </div>
        </form>
      </div>

      <div id="payment-placeholder" class="payment-placeholder-content">
        <i class="fa-solid fa-hand-pointer"></i>
        <h3>Select a contact</h3>
        <p>Choose a user from the list to start a payment.</p>
      </div>

    </div>
  </div>

  <div id="main-alert" class="alert d-none" role="alert"></div>

  <script src="../js/send.js"></script>
</body>
</html>
