<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartWallet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../style/global.css">
  <link rel="stylesheet" href="../style/index.css">
</head>
<body>

  <div class="app-container">
    
    <aside class="sidebar">
      
      <div class="sidebar-header">
        <div class="wallet-card">
          <h6>Welcome back,</h6>
          <h3 id="user-name">Loading...</h3>
          <h6>Current Balance</h6>
          <h1 id="wallet-balance">₹0.00</h1>
        </div>
      </div>

      <nav class="payment-actions">
        <h5>Actions</h5>
        <div class="actions-grid">
          <button class="action-btn" id="action-notifications">
            <i class="fa-solid fa-bell"></i>
            <span id="notif-badge" class="notif-badge d-none">0</span>
          </button>
          <button class="action-btn" id="action-send-user">
            <i class="fa-solid fa-user"></i>
            Send to User
          </button>
          <button class="action-btn" id="action-pay-merchant">
            <i class="fa-solid fa-store"></i>
            Pay Merchant
          </button>
          <button class="action-btn" id="action-history">
            <i class="fa-solid fa-receipt"></i>
            History
          </button>
          <button class="action-btn" id="action-reports">
            <i class="fa-solid fa-chart-line"></i>
            Reports
          </button>
          <button class="action-btn" id="action-rewards">
            <i class="fa-solid fa-gift"></i>
            Rewards
          </button>
          <button class="action-btn" id="action-refund">
            <i class="fa-solid fa-undo"></i>
            Request Refund
          </button>
          <button class="action-btn" id="action-manage-refunds">
            <i class="fa-solid fa-list"></i>
            Manage Refunds
          </button>
          <button class="action-btn" id="logout-btn">
            <i class="fa-solid fa-sign-out-alt"></i>
            Logout
          </button>
        </div>
      </nav>
    </aside>

    <main class="main-content">
      
      <div class="content-header">
        <h2>Dashboard</h2>
        <div class="profile-top-right">
          <button id="profile-btn" class="profile-btn" title="View profile">
            <div class="avatar-sm" id="top-avatar">U</div>
          </button>
        </div>
      </div>

      <div class="widget">
        <h4 class="widget-title">Quick Send</h4>
        <div class="quick-send-list" id="quick-send-list">
          <a href="send.html" class="quick-contact-item add-new">
            <div class="avatar-sm"><i class="fa-solid fa-plus"></i></div>
            <h6>New</h6>
          </a>
          </div>
      </div>

      <div class="widget promo-widget">
        <div class="promo-icon">
          <i class="fa-solid fa-gift"></i>
        </div>
        <div class="promo-text">
          <h4>Refer & Earn ₹50</h4>
          <p>Invite a friend and earn ₹50 cashback on their first payment.</p>
        </div>
        <button class="promo-btn" id="invite-btn">Invite Now</button>
      </div>
      </main>

  </div>

  <div id="main-alert" class="alert d-none" role="alert"></div>

  <script src="../js/app.js"></script>
</body>
</html>
