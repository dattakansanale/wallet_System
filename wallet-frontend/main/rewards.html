<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rewards - SmartWallet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../style/global.css">
  <link rel="stylesheet" href="../style/history.css">
</head>
<body>

  <div class="history-container">
    <div class="history-panel">
      <div class="panel-header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <h2>Your Rewards</h2>
        <p>View your reward points, history and redeem them for wallet credit.</p>
      </div>

      <div class="rewards-summary-container">
        <div class="rewards-summary">
          <h3>Total Points: <span id="reward-points">-</span></h3>
          <button id="redeem-btn" class="btn-primary">Redeem All</button>
        </div>
      </div>

      <div class="data-list-container">
        <h4 style="margin:0.5rem 0 0.5rem 0;">Rewards History</h4>
        <div class="data-list" id="rewards-list">
          <div class="text-center text-muted" style="padding: 2rem;">Loading rewards...</div>
        </div>
      </div>

    </div>
  </div>

  <div id="main-alert" class="alert d-none" role="alert"></div>

  <script src="../js/rewards.js"></script>
</body>
</html>
