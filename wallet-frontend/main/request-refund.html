<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request Refund - SmartWallet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../style/global.css">
  <link rel="stylesheet" href="../style/history.css">
</head>
<body>

  <div class="history-container">
    <div class="history-panel">
      <div class="panel-header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <h2>Request a Refund</h2>
        <p>Submit a refund request to the merchant for a transaction.</p>
      </div>

      <div class="form-card">
        <label for="txn-id">Transaction ID</label>
        <input id="txn-id" type="text" placeholder="Enter Transaction ID">

        <label for="merchant-id">Merchant ID</label>
        <input id="merchant-id" type="text" placeholder="Merchant ID (from payment)">

        <label for="reason">Reason</label>
        <textarea id="reason" rows="4" placeholder="Reason for refund"></textarea>

        <div style="margin-top:12px; text-align:right">
          <button id="submit-refund" class="btn btn-primary">Submit Refund Request</button>
        </div>
      </div>

    </div>
  </div>

  <div id="main-alert" class="alert d-none" role="alert"></div>
  <script src="../js/request-refund.js"></script>
</body>
</html>
