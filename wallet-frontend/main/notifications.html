<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications - SmartWallet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../style/global.css">
  <link rel="stylesheet" href="../style/history.css">
</head>
<body>

  <div class="history-container">
    <div class="history-panel">
      <div class="panel-header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <h2>Notifications</h2>
        <p>Your recent notifications.</p>
      </div>

      <div class="data-list-container">
        <div class="data-list" id="notifications-list">
          <div class="text-center text-muted" style="padding: 2rem;">Loading notifications...</div>
        </div>
      </div>

      <div style="padding:1rem;">
        <button id="mark-all-read" class="btn-secondary">Mark all as read</button>
      </div>

      <!-- Modal for notification detail -->
      <div id="notif-modal" class="d-none" style="position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:2000;">
        <div id="notif-backdrop" style="position:absolute;inset:0;background:rgba(0,0,0,0.5);"></div>
        <div id="notif-modal-box" style="position:relative;background:#fff;padding:1rem;border-radius:6px;max-width:560px;width:90%;z-index:2001;box-shadow:0 8px 24px rgba(0,0,0,0.2);">
          <button id="notif-modal-close" style="position:absolute;right:8px;top:8px;background:transparent;border:none;font-size:1.2rem;">&times;</button>
          <div id="notif-modal-content">
            <h4 id="notif-title">Notification</h4>
            <p id="notif-body" style="white-space:pre-wrap;color:#333;"></p>
            <p id="notif-meta" style="color:#666;font-size:0.9rem;margin-top:0.5rem;"></p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div id="main-alert" class="alert d-none" role="alert"></div>

  <script src="../js/notifications.js"></script>
</body>
</html>
