<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History - SmartWallet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../style/global.css">
  <link rel="stylesheet" href="../style/history.css">
</head>
<body>

  <div class="history-container">
    
    <div class="history-panel">
      <div class="panel-header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <h2>Transaction History</h2>
        <p>A complete record of all your wallet activity.</p>
        <div id="rewards-panel" class="rewards-panel">
          <div class="rewards-summary">
            <strong>Reward Points:</strong> <span id="reward-points">-</span>
            <button id="redeem-btn" class="btn-secondary" style="margin-left:1rem;">Redeem</button>
          </div>
          <div id="rewards-list" class="rewards-list"></div>
        </div>
      </div>
      
      <div class="data-list-container">
        <div class="data-list" id="data-list">
          <div class="text-center text-muted" style="padding: 2rem;">Loading history...</div>
        </div>
      </div>
    </div>
  </div>

  <div id="main-alert" class="alert d-none" role="alert"></div>

  <script src="../js/history.js"></script>
</body>
</html>
