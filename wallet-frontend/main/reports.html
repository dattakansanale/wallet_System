<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monthly Report - SmartWallet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../style/global.css">
  <link rel="stylesheet" href="../style/index.css">
  <style>
    .reports-wrapper { max-width: 980px; margin: 1.5rem auto; }
    .kpi-grid { display:flex; gap:1rem; margin-bottom:1rem; }
    .kpi { flex:1; padding:0.8rem; border-radius:8px; background:#fff; box-shadow:var(--card-shadow); }
    .charts { display:flex; gap:1rem; margin-top:1rem; }
    .chart-card { flex:1; padding:1rem; border-radius:8px; background:#fff; box-shadow:var(--card-shadow); }
    .controls { display:flex; gap:0.5rem; align-items:center; margin-bottom:0.75rem; }
    .btn { padding:0.5rem 0.75rem; border-radius:8px; border:none; cursor:pointer; }
    .btn-primary { background:var(--gradient); color:#fff; }
    .btn-outline { background:#fff; border:1px solid #e6e9ef; }
    table.report-table { width:100%; border-collapse:collapse; margin-top:0.5rem; }
    table.report-table th, table.report-table td { padding:0.5rem; border-bottom:1px solid #f1f3f6; text-align:left; }
  </style>
</head>
<body>
  <div class="reports-wrapper">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    <h2 style="margin-top:0.5rem;">Monthly Analysis</h2>

    <div class="controls">
      <label>From: <input type="date" id="report-start" /></label>
      <label>To:   <input type="date" id="report-end" /></label>
      <button id="load-report" class="btn btn-primary">Load</button>
      <button id="download-csv" class="btn btn-outline">Download CSV</button>
      <div style="margin-left:auto;color:var(--text-muted);">Showing <strong id="report-type">Your</strong> report</div>
    </div>

    <div class="kpi-grid">
      <div class="kpi">
        <div class="kpi-title">Total Sent</div>
        <div class="kpi-value" id="kpi-total-sent">₹0.00</div>
      </div>
      <div class="kpi">
        <div class="kpi-title">Total Received</div>
        <div class="kpi-value" id="kpi-total-recv">₹0.00</div>
      </div>
      <div class="kpi">
        <div class="kpi-title">Transactions</div>
        <div class="kpi-value" id="kpi-count">0</div>
      </div>
      <div class="kpi">
        <div class="kpi-title">Avg Transaction</div>
        <div class="kpi-value" id="kpi-avg">₹0.00</div>
      </div>
    </div>

    <div class="charts">
      <div class="chart-card">
        <h4>Daily Trend</h4>
        <canvas id="chart-daily" height="180"></canvas>
      </div>
      <div class="chart-card">
        <h4>Top Counterparties</h4>
        <canvas id="chart-top" height="180"></canvas>
        <div id="top-list"></div>
      </div>
    </div>

    <div class="chart-card" style="margin-top:1rem;">
      <h4>Top Payees / Payers</h4>
      <table class="report-table" id="top-table">
        <thead><tr><th>Name</th><th>Type</th><th>Amount</th><th>Transactions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <div id="main-alert" class="alert d-none" role="alert"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/reports.js"></script>
</body>
</html>
