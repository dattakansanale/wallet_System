<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Refunds - SmartWallet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../style/global.css">
  <link rel="stylesheet" href="../style/history.css">
</head>
<body>

  <div class="history-container">
    <div class="history-panel">
      <div class="panel-header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <h2>Refund Requests</h2>
        <p>Approve or decline refund requests for your merchant account.</p>
      </div>

      <div class="data-list-container">
        <div class="data-list" id="refunds-list">
          <div class="text-center text-muted" style="padding: 2rem;">Loading refund requests...</div>
        </div>
      </div>

    </div>
  </div>

  <div id="main-alert" class="alert d-none" role="alert"></div>
  <script src="../js/refund-requests.js"></script>
</body>
</html>
