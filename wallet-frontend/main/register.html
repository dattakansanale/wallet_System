<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - SmartWallet</title>
  <link rel="stylesheet" href="../style/global.css">
  <link rel="stylesheet" href="../style/register.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-card-body">
        <h3 class="auth-card-title">Create Account</h3>
        <p class="auth-card-subtitle">Join SmartWallet today</p>
        
        <form id="register-form">
          <div class="row">
            <div class="col">
              <div class="form-group">
                <label for="fName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="fName" required>
              </div>
            </div>
            <div class="col">
              <div class="form-group">
                <label for="lName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lName" required>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone" placeholder="10 digits" maxlength="10" required>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Minimum 6 characters" required>
          </div>

          <div class="form-group">
            <label for="pin" class="form-label">Wallet PIN</label>
            <input type="password" class="form-control" id="pin" placeholder="6 digits" maxlength="6" required>
            <small class="form-text">This 6-digit PIN is required for all transactions</small>
          </div>

          <div class="form-group">
            <div style="display:flex; align-items:center; gap:12px;">
              <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="isMerchant"> Register as merchant</label>
              <button type="submit" class="btn btn-primary">Register</button>
            </div>
          </div>

          <!-- Merchant extra fields (hidden unless Register as merchant checked) -->
          <div id="merchant-fields" style="display:none; margin-top:12px;">
            <div class="form-group">
              <label for="businessName" class="form-label">Business / Shop Name</label>
              <input type="text" class="form-control" id="businessName" placeholder="e.g., John's Grocery">
            </div>
            <div class="form-group">
              <label for="businessType" class="form-label">Business Type</label>
              <input type="text" class="form-control" id="businessType" placeholder="e.g., Retail, Food">
            </div>
            <div class="form-group">
              <label for="businessAddress" class="form-label">Business Address</label>
              <input type="text" class="form-control" id="businessAddress" placeholder="Shop address">
            </div>
          </div>
        </form>

        <div id="auth-alert" class="d-none" role="alert"></div>
        
        <div class="auth-footer-link">
          <p>Already have an account? <a href="login.html">Login</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/register.js"></script>
</body>
</html>
